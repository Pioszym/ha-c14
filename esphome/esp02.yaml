button:
  # Symulacja slave boot announcement 80(2A) src=0x44
  # Wysyła 80(2A) i aktywuje slave (odtąd reactive E4(2A) na AA(44) dziala).
  # Działa TYLKO gdy c14_rola = Slave.
  - platform: template
    name: "Slave Boot 80(2A)"
    id: btn_slave_boot
    icon: mdi:restart-alert
    on_press:
      - if:
          condition:
            lambda: 'return id(g_slave_on);'
          then:
            - lambda: |-
                std::vector<uint8_t> f = {
                  0x80,0x44,0x5F,0x2A,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
                  0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
                  0x7E,0x7E,0x7E,0x7E,0x7E,0x23 };
                id(uart_aero).write_array(f.data(), f.size());
                id(uart_nano).write_array(f.data(), f.size());
                id(g_slave_active) = true;
                ESP_LOGW("c14m", ">>> BOOT_80_2A_SLAVE (slave aktywowany, E4(2A) reactive ON) 80,44,5F,2A,7E,7E,7E,7E,7E,7E,7E,7E,7E,7E,7E,7E,7E,7E,7E,7E,7E,7E,7E,7E,7E,7E,7E,7E,7E,23");
          else:
            - lambda: |-
                ESP_LOGW("c14m","!!! Przycisk Boot 80(2A) dziala tylko w roli Slave !!!");

  # Master Config Push E4(29) src=0x2A — symulacja Nano master response do slave id=2 po boot
  # Wysyła ramkę config push z f[4-13] zaobserwowanymi od Nano mastera.
  # Działa TYLKO gdy c14_rola = Master.
  - platform: template
    name: "Master Config Push E4(29) src=0x2A"
    id: btn_master_config_push
    icon: mdi:cog-refresh
    on_press:
      - if:
          condition:
            lambda: 'return id(g_master_on);'
          then:
            - lambda: |-
                std::vector<uint8_t> f = {
                  0xE4,0x2A,0x00,0x29,0x0D,0x01,0x05,0x28,0x1C,0x2A,0x00,0x1E,
                  0x01,0x17,0x5F,0x64,0x18,0x14,0x00,0x24,0x20,0x28,0x46,0x25,
                  0x2D,0x4B,0x20,0x01,0x53,0x23 };
                // Cksum dla src=0x2A (K=0xA3 jak dla E4)
                uint16_t s = f[0] + f[1];
                for (int i = 3; i <= 28; i++) s += f[i];
                f[2] = (s + 0xA3) & 0xFF;
                id(uart_aero).write_array(f.data(), f.size());
                id(uart_nano).write_array(f.data(), f.size());
                char h[120]; int p = 0;
                for (size_t i = 0; i < f.size() && p < 110; i++)
                  p += snprintf(h+p, 120-p, "%s%02X", i?",":"", f[i]);
                ESP_LOGW("c14m", ">>> MASTER_CONFIG_PUSH_E4_2A %s", h);
          else:
            - lambda: |-
                ESP_LOGW("c14m","!!! Przycisk Master Config Push dziala tylko w roli Master !!!");

