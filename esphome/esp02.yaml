select:
  - platform: template
    name: "C14 Rola"
    id: sel_rola
    icon: mdi:account-switch
    options: ["OFF", "Master", "Slave"]
    initial_option: "Master"
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          if (x == "Master") {
            if (id(g_forward_on)) {
              ESP_LOGW("c14m","!!! Wylaczam forward (kolizja z masterem) !!!");
              id(g_forward_on) = false;
            }
            id(g_master_on) = true;
            id(g_slave_on) = false;
            id(g_slave_active) = false;
            id(g_cycle_count) = 0;
            id(g_aero_resp_total) = 0;
            ESP_LOGW("c14m","=== ROLA: MASTER ===");
          } else if (x == "Slave") {
            id(g_master_on) = false;
            id(g_slave_on) = true;
            id(g_slave_active) = false;  // cisza az do Slave Boot
            ESP_LOGW("c14m","=== ROLA: SLAVE id=2 (cichy — wcisnij Slave Boot by aktywowac) ===");
          } else {
            id(g_master_on) = false;
            id(g_slave_on) = false;
            id(g_slave_active) = false;
            ESP_LOGW("c14m","=== ROLA: OFF (pasywny) ===");
          }

  - platform: template
    name: "Bieg"
    id: sel_gear
    icon: mdi:fan
    options: ["Stop", "Bieg 1", "Bieg 2", "Bieg 3"]
    initial_option: "Bieg 1"
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          if      (x == "Stop")   id(g_gear_cmd) = 0x01;
          else if (x == "Bieg 1") id(g_gear_cmd) = 0x03;
          else if (x == "Bieg 2") id(g_gear_cmd) = 0x05;
          else if (x == "Bieg 3") id(g_gear_cmd) = 0x07;
          ESP_LOGW("c14m","Bieg: %s (0x%02X)", x.c_str(), id(g_gear_cmd));

  - platform: template
    name: "Bypass"
    id: sel_bypass
    icon: mdi:valve
    options: ["OFF", "AUTO", "ON"]
    initial_option: "AUTO"
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          if      (x == "OFF")  id(g_bypass_cmd) = 0x60;
          else if (x == "AUTO") id(g_bypass_cmd) = 0x61;
          else if (x == "ON")   id(g_bypass_cmd) = 0x62;
          ESP_LOGW("c14m","Bypass: %s (0x%02X)", x.c_str(), id(g_bypass_cmd));

  - platform: template
    name: "Sezon"
    id: sel_season
    icon: mdi:weather-partly-snowy
    options: ["Zima ogrzewania", "Lato bez ogrz/chlodz", "Chlodzenie"]
    initial_option: "Zima ogrzewania"
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          if      (x == "Zima ogrzewania")       id(g_season) = 0;
          else if (x == "Lato bez ogrz/chlodz")  id(g_season) = 1;
          else if (x == "Chlodzenie")            id(g_season) = 2;
          ESP_LOGW("c14m","Sezon: %s (%d)", x.c_str(), id(g_season));

