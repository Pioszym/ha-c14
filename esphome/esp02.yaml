substitutions:
  device_name: esp02
  friendly_name: "C14 Master"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

api:
  encryption:
    key: !secret esp02_api

ota:
  - platform: esphome
    password: !secret ota_password

packages:
  wifi: !include packages/wifi_Pioszym_IoT.yaml
  device_base: !include packages/device_base.yaml

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Warsaw

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

################################################################################
# C14 ESP32 MASTER — TX do AERO przez uart_aero (GPIO16/17)
#
# Potwierdzone 2026-04-15:
#   - E3(29) src=0x44 jest TRIGGEREM (AERO odpowiada E4(63) temperaturami)
#   - E4(29) src=0x21 jest KOMENDA biegu (AERO reaguje mechanicznie)
#   - Reszta 8 ramek = broadcasts dla Nano/iNext, AERO ignoruje
#
# Cykl mastera (kolejnosc zgodna z Nano Master Mini):
#   1. E4(29) bieg + zegar   + 800ms slot (komenda PIERWSZA jak u Nano)
#   2. E3(29) src44 QUERY    + 800ms slot -> AERO odpowie E4(63) tutaj
#   3. E3(29) src56 iNEXT    + 800ms slot (rezerwacja miejsca dla iNext)
#   4. E2(29) status         + 800ms slot
#   5. E5(29) setpointy      + 800ms slot
#   6. F0(29) heartbeat      + 800ms slot
#   7. 81(29) Nano hb        + 800ms slot
#   8. D0(29) slave cfg      + 800ms slot
#   9. D1(29) slave cfg      + 800ms slot
#   10. D2(29) slave cfg     + 800ms slot
# Total: 10 * 800ms = 8.0s, interval 8500ms = jak Nano Master Mini.
# AERO odpowiada ~400ms po ramce #2 QUERY.
#
# Wymagania hardware:
#   - Nano odlaczony od busa (A/B) albo zostawiony pasywnie (ESP master)
#   - AERO podlaczony przez HW-0519 na GPIO16(RX)/17(TX)
################################################################################

uart:
  - id: uart_aero
    rx_pin: GPIO16
    tx_pin: GPIO17
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512
  - id: uart_nano
    rx_pin: GPIO4
    tx_pin: GPIO18
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512

globals:
  - id: g_aero_buf
    type: uint8_t[32]
  - id: g_aero_pos
    type: uint8_t
    initial_value: "0"
  - id: g_nano_buf
    type: uint8_t[32]
  - id: g_nano_pos
    type: uint8_t
    initial_value: "0"
  - id: g_master_on
    type: bool
    restore_value: true
    initial_value: "true"    # default ON, sterowane z select.c14_rola
  - id: g_slave_on
    type: bool
    restore_value: true
    initial_value: "false"   # sterowane z select.c14_rola
  - id: g_slave_active
    type: bool
    initial_value: "false"   # aktywuje sie po wcisnieciu Slave Boot (E4(2A) reactive)
  - id: g_forward_on
    type: bool
    initial_value: "false"   # domyslnie OFF zeby nie kolidowal z masterem
  - id: g_gear_cmd
    type: uint8_t
    restore_value: true
    initial_value: "0x03"   # Manual B1 (0x01=Stop, 0x03=B1, 0x05=B2, 0x07=B3; +0x08=chlodz overlay dodawany dynamicznie)
  - id: g_bypass_cmd
    type: uint8_t
    restore_value: true
    initial_value: "0x61"   # AUTO (0x60=OFF, 0x61=AUTO, 0x62=ON)
  - id: g_season
    type: uint8_t
    restore_value: true
    initial_value: "0"      # 0=Zima, 1=Lato bez, 2=Chlodzenie
  - id: g_wietrz_on
    type: bool
    restore_value: true
    initial_value: "false"
  - id: g_master_full
    type: bool
    restore_value: true
    initial_value: "false"   # false=Mini (10 ramek), true=Full (27 ramek)
  # Setpointy temperatur (5 trybow, wartosci w stopniach C)
  - id: g_sp_comfort
    type: float
    restore_value: true
    initial_value: "23.0"
  - id: g_sp_eco
    type: float
    restore_value: true
    initial_value: "21.0"
  - id: g_sp_chlodz
    type: float
    restore_value: true
    initial_value: "23.0"
  - id: g_sp_reczna
    type: float
    restore_value: true
    initial_value: "22.0"
  - id: g_sp_poza
    type: float
    restore_value: true
    initial_value: "20.0"
  - id: g_cycle_count
    type: uint32_t
    initial_value: "0"
  - id: g_aero_resp_cycle
    type: uint16_t
    initial_value: "0"
  - id: g_aero_resp_total
    type: uint32_t
    initial_value: "0"
  - id: g_cnt_nano
    type: uint32_t
    initial_value: "0"
  - id: g_last_tx_ms
    type: uint32_t
    initial_value: "0"
  - id: g_last_tx_name
    type: std::string
    initial_value: '"none"'
  # Cache temperatur AERO (ostatnie znane, dla broadcastu gdy AERO milczy)
  - id: g_cache_czerp
    type: float
    initial_value: "0.0"
  - id: g_cache_nawiew
    type: float
    initial_value: "0.0"
  - id: g_cache_wyrzut
    type: float
    initial_value: "0.0"
  - id: g_cache_wywiew
    type: float
    initial_value: "0.0"
  - id: g_cache_valid
    type: bool
    initial_value: "false"
  - id: g_cache_age_ms
    type: uint32_t
    initial_value: "0"
  - id: g_log_nano
    type: bool
    initial_value: "false"
  - id: g_log_aero
    type: bool
    initial_value: "false"
  - id: g_log_esp
    type: bool
    initial_value: "false"
  # Setpointy % nawiew/wywiew per bieg (1/2/3/wietrzenie)
  # TODO: wstrzyknac do odpowiednich pol w E4(29)/E5(29) gdy zidentyfikujemy ktore
  # Fabryczne wartosci z E3(29)_44 obserwowane
  - id: g_naw_b1
    type: uint8_t
    restore_value: true
    initial_value: "37"   # 0x25
  - id: g_wyw_b1
    type: uint8_t
    restore_value: true
    initial_value: "32"   # 0x20
  - id: g_naw_b2
    type: uint8_t
    restore_value: true
    initial_value: "45"   # 0x2D
  - id: g_wyw_b2
    type: uint8_t
    restore_value: true
    initial_value: "40"   # 0x28
  - id: g_naw_b3
    type: uint8_t
    restore_value: true
    initial_value: "75"   # 0x4B
  - id: g_wyw_b3
    type: uint8_t
    restore_value: true
    initial_value: "70"   # 0x46
  - id: g_naw_wiet
    type: uint8_t
    restore_value: true
    initial_value: "100"  # 0x64
  - id: g_wyw_wiet
    type: uint8_t
    restore_value: true
    initial_value: "95"   # 0x5F

script:
  # Master TX: zawsze wysyla na OBA UART-y (uart_aero do AERO, uart_nano do slaves na magistrali Nano).
  # Forward jest passive bridge AERO<->Nano w interval parsers, nie tutaj.
  - id: tx_frame
    mode: single
    parameters:
      name: string
      bytes: std::vector<uint8_t>
    then:
      - lambda: |-
          id(g_last_tx_ms) = millis();
          id(g_last_tx_name) = name;
          id(uart_aero).write_array(bytes.data(), bytes.size());
          id(uart_nano).write_array(bytes.data(), bytes.size());
          if (id(g_log_esp)) {
            char h[120]; int p = 0;
            for (size_t i = 0; i < bytes.size() && p < 110; i++)
              p += snprintf(h+p, 120-p, "%s%02X", i?",":"", bytes[i]);
            ESP_LOGW("c14m", ">>> #%s_%s", name.c_str(), h);
          }

  # Cykl 10 ramek z 500ms slotem po kazdej
  - id: master_cycle
    mode: single
    then:
      - lambda: |-
          id(g_aero_resp_cycle) = 0;
          id(g_cycle_count)++;

      # 1. E4(29) — komenda biegu + sezon + wietrzenie (PIERWSZA jak u Nano)
      # f[8-9]=zegar, f[12-13]=temp pokojowa (copy z cache), f[14-15]=aktywny setpoint Comfort,
      # f[27]=sezon (0x00/0x08/0x10) + bit 0x20 wietrzenie + bity 0-1 tryb temp manual (0x02),
      # f[28]=bieg manual (0x01/03/05/07) + overlay chlodz (0x08) gdy sezon=Chlodzenie
      - script.execute:
          id: tx_frame
          name: "1"
          bytes: !lambda |-
            std::vector<uint8_t> f = {
              0xE4,0x21,0x00,0x29,0x0A,0x40,0x00,0x02,0x08,0x2E,0x7E,0x00,
              0x11,0x0E,0x11,0x22,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
              0x14,0x64,0x02,0x04,0x00,0x03,0x23 };
            auto t = id(ha_time).now();
            if (t.is_valid()) {
              f[4] = t.day_of_month & 0xFF;   // dzien miesiaca
              f[7] = t.day_of_week & 0xFF;    // dzien tygodnia (1=Mon, 7=Sun)
              f[8] = t.hour & 0xFF;
              f[9] = t.minute & 0xFF;
            }
            auto enc = [&f](int idx, float tv) {
              int16_t v = (int16_t)(tv * 10.0f) + 2000;
              if (v < 0) v = 0;
              f[idx] = (v / 128) & 0xFF;
              f[idx+1] = (v % 128) & 0xFF;
            };
            // f[12-13] = temp pokojowa (u Nano to sensor CTP, u nas przyblizenie z Comfort setpoint)
            enc(12, id(g_sp_comfort));
            // f[14-15] = aktywny setpoint (Comfort jako default)
            enc(14, id(g_sp_comfort));
            // f[27]: bity 0-1 = tryb temp (manual=0x02), bity 3-5 = sezon + wietrzenie
            uint8_t v27 = 0x02;  // temp manual
            if (id(g_season) == 1) v27 |= 0x08;
            else if (id(g_season) == 2) v27 |= 0x10;
            if (id(g_wietrz_on)) v27 |= 0x20;
            f[27] = v27;
            // f[28]: bieg manual + overlay chlodz
            uint8_t v28 = id(g_gear_cmd);
            if (id(g_season) == 2) v28 |= 0x08;
            f[28] = v28;
            uint16_t s = f[0] + f[1];
            for (int i = 3; i <= 28; i++) s += f[i];
            f[2] = (s + 0xA3) & 0xFF;
            return f;
      - delay: 800ms

      # 2. E3(29) src=44 — QUERY (trigger AERO) + nastawy % per bieg + znacznik biegu f[28]
      # f[14-15]=Wiet wyw/naw, f[20-22]=B1/B2/B3 wyw, f[23-25]=B1/B2/B3 naw
      # f[28] znacznik biegu: wzor f[28] = bieg + 0x10
      - script.execute:
          id: tx_frame
          name: "2"
          bytes: !lambda |-
            std::vector<uint8_t> f = {
              0xE3,0x44,0x00,0x29,0x32,0x00,0x05,0x0A,0x28,0x1C,0x2A,0x1E,
              0x01,0x17,0x5F,0x64,0x18,0x14,0x00,0x24,0x20,0x28,0x46,0x25,
              0x2D,0x4B,0x20,0x01,0x13,0x23 };
            f[14] = id(g_wyw_wiet);
            f[15] = id(g_naw_wiet);
            f[20] = id(g_wyw_b1);
            f[21] = id(g_wyw_b2);
            f[22] = id(g_wyw_b3);
            f[23] = id(g_naw_b1);
            f[24] = id(g_naw_b2);
            f[25] = id(g_naw_b3);
            uint8_t v28 = id(g_gear_cmd);
            if (id(g_season) == 2) v28 |= 0x08;
            f[28] = v28 + 0x10;
            uint16_t s = f[0] + f[1];
            for (int i = 3; i <= 28; i++) s += f[i];
            f[2] = (s + 0xA3) & 0xFF;
            return f;
      - delay: 800ms

      # 3. E3(29) src=56 — iNEXT slot (pusty, rezerwacja miejsca)
      - script.execute:
          id: tx_frame
          name: "3"
          bytes: !lambda |-
            return { 0xE3,0x56,0x05,0x29,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
                     0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
                     0x00,0x00,0x00,0x00,0x00,0x23 };
      - delay: 800ms

      # 4. E2(29) — status broadcast
      - script.execute:
          id: tx_frame
          name: "4"
          bytes: !lambda |-
            return { 0xE2,0x44,0x1E,0x29,0x4D,0x00,0x00,0x00,0x03,0x7E,0x7E,0x7E,
                     0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
                     0x7E,0x00,0x00,0x7E,0x7E,0x23 };
      - delay: 800ms

      # 5. E5(29) — setpointy + bypass + sezon
      # f[6-7]=T.Czerpnia (z cache AERO), f[8-9]=Comfort, f[10-11]=Eco, f[12-13]=Chlodzenie,
      # f[14-15]=Zadana reczna, f[16-17]=Poza domem, f[25]=bypass, f[27]=sezon (0/0x0A/0x14),
      # f[28]=kod biegu dla UI (0=Stop, 1=B1, 2=B2, 3=B3)
      - script.execute:
          id: tx_frame
          name: "5"
          bytes: !lambda |-
            std::vector<uint8_t> f = {
              0xE5,0x21,0x00,0x29,0x00,0x00,0x10,0x4D,0x11,0x36,0x11,0x22,
              0x11,0x36,0x11,0x2C,0x11,0x18,0x00,0x30,0x7E,0x00,0x7E,0x00,
              0x00,0x61,0x00,0x00,0x00,0x23 };
            // Kodowanie temperatury: val = temp*10 + 2000 -> H=val/128, L=val%128
            auto enc = [&f](int idx, float t) {
              int16_t v = (int16_t)(t * 10.0f) + 2000;
              if (v < 0) v = 0;
              f[idx] = (v / 128) & 0xFF;
              f[idx+1] = (v % 128) & 0xFF;
            };
            if (id(g_cache_valid)) enc(6, id(g_cache_czerp));
            enc(8, id(g_sp_comfort));
            enc(10, id(g_sp_eco));
            enc(12, id(g_sp_chlodz));
            enc(14, id(g_sp_reczna));
            enc(16, id(g_sp_poza));
            f[25] = id(g_bypass_cmd);
            // f[27] sezon: 0=Zima -> 0x00, 1=Lato bez -> 0x0A, 2=Chlodzenie -> 0x14
            uint8_t s27 = 0x00;
            if (id(g_season) == 1) s27 = 0x0A;
            else if (id(g_season) == 2) s27 = 0x14;
            f[27] = s27;
            // f[28] kod biegu w E5: 0/1/2/3 sekwencyjnie (bez bitu validity)
            uint8_t g = id(g_gear_cmd) & 0x07;
            f[28] = (g == 0x01) ? 0x00 : (g == 0x03) ? 0x01 : (g == 0x05) ? 0x02 : (g == 0x07) ? 0x03 : 0x00;
            uint16_t s = f[0] + f[1];
            for (int i = 3; i <= 28; i++) s += f[i];
            f[2] = (s + 0xA3) & 0xFF;
            return f;
      - delay: 800ms

      # 6. F0(29) — heartbeat broadcast
      - script.execute:
          id: tx_frame
          name: "6"
          bytes: !lambda |-
            return { 0xF0,0x44,0x4E,0x29,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
                     0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
                     0x7E,0x7E,0x7E,0x7E,0x7E,0x23 };
      - delay: 800ms

      # 7. 81(29) — Nano heartbeat
      - script.execute:
          id: tx_frame
          name: "7"
          bytes: !lambda |-
            return { 0x81,0x44,0x5F,0x29,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
                     0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
                     0x7E,0x7E,0x7E,0x7E,0x7E,0x23 };
      - delay: 800ms

      # 8. D0(29) — slave config
      - script.execute:
          id: tx_frame
          name: "8"
          bytes: !lambda |-
            return { 0xD0,0x44,0x65,0x29,0x53,0x4B,0x41,0x07,0x68,0x07,0x04,0x00,
                     0x6E,0x00,0x5A,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
                     0x7E,0x7E,0x7E,0x7E,0x7E,0x23 };
      - delay: 800ms

      # 9. D1(29)
      - script.execute:
          id: tx_frame
          name: "9"
          bytes: !lambda |-
            return { 0xD1,0x44,0x66,0x29,0x53,0x4B,0x41,0x07,0x68,0x07,0x04,0x00,
                     0x6E,0x00,0x5A,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
                     0x7E,0x7E,0x7E,0x7E,0x7E,0x23 };
      - delay: 800ms

      # 10. D2(29)
      - script.execute:
          id: tx_frame
          name: "10"
          bytes: !lambda |-
            return { 0xD2,0x44,0x67,0x29,0x53,0x4B,0x41,0x07,0x68,0x07,0x04,0x00,
                     0x6E,0x00,0x5A,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
                     0x7E,0x7E,0x7E,0x7E,0x7E,0x23 };
      - delay: 800ms

      # ========== MASTER FULL EXTENSION (27 ramek total, ~22s cykl) ==========
      # Ramki 11-27 wysylane tylko gdy g_master_full=true.
      # Zawartosc statyczna (0x7E/0x00 fill) — enumeration/keepalive dla slaves.
      # Hipoteza: Nano slave moze potrzebowac tych ramek do time sync / enumeration.

      # 11. D3(29) — slave config rozszerzony
      - if:
          condition:
            lambda: 'return id(g_master_full);'
          then:
            - script.execute:
                id: tx_frame
                name: "11"
                bytes: !lambda |-
                  return { 0xD3,0x44,0x68,0x29,0x53,0x4B,0x41,0x07,0x68,0x07,0x04,0x00,
                           0x6E,0x00,0x5A,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
                           0x7E,0x7E,0x7E,0x7E,0x7E,0x23 };
            - delay: 800ms

      # 12. D4(29)
      - if:
          condition:
            lambda: 'return id(g_master_full);'
          then:
            - script.execute:
                id: tx_frame
                name: "12"
                bytes: !lambda |-
                  return { 0xD4,0x44,0x69,0x29,0x53,0x4B,0x41,0x07,0x68,0x07,0x04,0x00,
                           0x6E,0x00,0x5A,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
                           0x7E,0x7E,0x7E,0x7E,0x7E,0x23 };
            - delay: 800ms

      # 13. D5(29)
      - if:
          condition:
            lambda: 'return id(g_master_full);'
          then:
            - script.execute:
                id: tx_frame
                name: "13"
                bytes: !lambda |-
                  return { 0xD5,0x44,0x6A,0x29,0x53,0x4B,0x41,0x07,0x68,0x07,0x04,0x00,
                           0x6E,0x00,0x5A,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
                           0x7E,0x7E,0x7E,0x7E,0x7E,0x23 };
            - delay: 800ms

      # 14. E3(29) src=44 — DRUGI QUERY (identyczny jak #2, AERO odpowie ponownie)
      - if:
          condition:
            lambda: 'return id(g_master_full);'
          then:
            - script.execute:
                id: tx_frame
                name: "14"
                bytes: !lambda |-
                  std::vector<uint8_t> f = {
                    0xE3,0x44,0x00,0x29,0x32,0x00,0x05,0x0A,0x28,0x1C,0x2A,0x1E,
                    0x01,0x17,0x5F,0x64,0x18,0x14,0x00,0x24,0x20,0x28,0x46,0x25,
                    0x2D,0x4B,0x20,0x01,0x13,0x23 };
                  f[14] = id(g_wyw_wiet);
                  f[15] = id(g_naw_wiet);
                  f[20] = id(g_wyw_b1);
                  f[21] = id(g_wyw_b2);
                  f[22] = id(g_wyw_b3);
                  f[23] = id(g_naw_b1);
                  f[24] = id(g_naw_b2);
                  f[25] = id(g_naw_b3);
                  uint8_t v28 = id(g_gear_cmd);
                  if (id(g_season) == 2) v28 |= 0x08;
