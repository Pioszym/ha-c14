select:
  - platform: template
    name: "C14 Rola"
    id: sel_rola
    icon: mdi:account-switch
    options: ["OFF", "Master", "Slave"]
    initial_option: "Master"
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          if (x == "Master") {
            id(g_master_on) = true;
            id(g_slave_on) = false;
            id(g_slave_ack) = false;  // reset ACK - bedzie ustawione po wykryciu slave reactive
            ESP_LOGW("c14m","=== ROLA: MASTER (VS niezalezne, mozna laczyc Master+VS dla testu lancucha) ===");
            id(master_cycle).execute();  // start petli (jesli juz leci, mode:queued zakolejkuje)
          } else if (x == "Slave") {
            id(g_master_on) = false;
            id(g_slave_on) = true;
            id(g_slave_ack) = false;
            ESP_LOGW("c14m","=== ROLA: SLAVE (VS id=2..5 wlaczone switchami symuluja slave'y) ===");
          } else {
            id(g_master_on) = false;
            id(g_slave_on) = false;
            id(g_slave_ack) = false;
            ESP_LOGW("c14m","=== ROLA: OFF (pasywny, VS dziala jesli wlaczone switchami) ===");
          }

  - platform: template
    name: "Wentylacja"
    id: sel_gear
    icon: mdi:fan
    options: ["Harmonogram", "Harm-Urlop", "Bieg 3", "Bieg 2", "Bieg 1", "Stop"]
    initial_option: "Bieg 1"
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          if      (x == "Stop")        { id(g_gear_cmd) = 0x01; id(g_harm_urlop) = false; }
          else if (x == "Bieg 1")      { id(g_gear_cmd) = 0x03; id(g_harm_urlop) = false; }
          else if (x == "Bieg 2")      { id(g_gear_cmd) = 0x05; id(g_harm_urlop) = false; }
          else if (x == "Bieg 3")      { id(g_gear_cmd) = 0x07; id(g_harm_urlop) = false; }
          else if (x == "Harmonogram") { id(g_harm_urlop) = false; }  // protokolowo identyczne z Manual+aktualny_bieg, slave nie odrozni
          else if (x == "Harm-Urlop")  { id(g_harm_urlop) = true;  }  // bieg z g_gear_cmd, ale bez bitu 0x40 + f[24]=0x32

  - platform: template
    name: "Wentylacja Poza domem / Urlop"
    id: sel_gear_poza
    icon: mdi:home-export-outline
    options: ["Bieg 3", "Bieg 2", "Bieg 1", "Stop"]
    initial_option: "Stop"
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          if      (x == "Stop")   id(g_gear_poza) = 0x01;
          else if (x == "Bieg 1") id(g_gear_poza) = 0x03;
          else if (x == "Bieg 2") id(g_gear_poza) = 0x05;
          else if (x == "Bieg 3") id(g_gear_poza) = 0x07;
          ESP_LOGW("c14m","Wentylacja Poza/Urlop: %s (0x%02X)", x.c_str(), id(g_gear_poza));

  - platform: template
    name: "Termostat"
    id: sel_termostat
    icon: mdi:thermostat
    options: ["Harmonogram", "Urlop", "Manual"]
    initial_option: "Manual"
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          if      (x == "Harmonogram") id(g_thermostat) = 0;
          else if (x == "Urlop")       id(g_thermostat) = 1;
          else if (x == "Manual")      id(g_thermostat) = 2;
          ESP_LOGW("c14m","Termostat: %s (0x%02X)", x.c_str(), id(g_thermostat));

  - platform: template
    name: "Program"
    id: sel_program
    icon: mdi:home-account
    options: ["Normal", "Poza domem", "Urlop"]
    initial_option: "Normal"
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          if      (x == "Normal")     id(g_program) = 0;
          else if (x == "Poza domem") id(g_program) = 1;
          else if (x == "Urlop")      id(g_program) = 2;
          ESP_LOGW("c14m","Program: %s (%d)", x.c_str(), id(g_program));

  - platform: template
    name: "Bypass"
    id: sel_bypass
    icon: mdi:valve
    options: ["OFF", "AUTO", "ON"]
    initial_option: "AUTO"
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          if      (x == "OFF")  id(g_bypass_cmd) = 0x60;
          else if (x == "AUTO") id(g_bypass_cmd) = 0x61;
          else if (x == "ON")   id(g_bypass_cmd) = 0x62;
          ESP_LOGW("c14m","Bypass: %s (0x%02X)", x.c_str(), id(g_bypass_cmd));

  - platform: template
