substitutions:
  device_name: esp02
  friendly_name: "C14 Master"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - delay: 5s   # poczekaj na pelny init (UART, WiFi, sensory, restore globals)
      - if:
          condition:
            lambda: 'return id(g_master_on);'
          then:
            - script.execute: master_cycle
            - logger.log: "=== Master cycle started after boot (g_master_on restored ON) ==="

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true 

api:
  encryption:
    key: !secret esp02_api

ota:
  - platform: esphome
    password: !secret ota_password

packages:
  wifi: !include packages/wifi_Pioszym_IoT.yaml
  device_base: !include packages/device_base.yaml

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Warsaw

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

################################################################################
# C14 ESP32 MASTER / SNIFFER — single-bus tap przez uart_bus (GPIO16/17)
#
# Topologia 2026-05-09: jeden modul HW-0519 RS-485 na GPIO16(RX)/17(TX),
# wpiety rownolegle do A1/B1 magistrali Nano <-> AERO. ESP widzi caly ruch
# busa (Nano broadcasts + AERO E4(63) odpowiedzi) na jednym RX; w razie
# potrzeby nadaje ramki na ten sam bus (master / VS slave).
#
# Bridge (forward Nano<->AERO) — usuniety: bus jest fizycznie wspolny,
# pass-through robi sama miedz.
#
# Cykl mastera (kolejnosc zgodna z Nano Master Mini):
#   1. E4(29) bieg + zegar   + 800ms slot
#   2. E3(29) src44 QUERY    + 800ms slot -> AERO odpowie E4(63) tutaj
#   3. E3(29) src56 iNEXT    + 800ms slot
#   4. E2(29) status         + 800ms slot
#   5. E5(29) setpointy      + 800ms slot
#   6. F0(29) heartbeat      + 800ms slot
#   7. 81(29) Nano hb        + 800ms slot
#   8. D0(29) slave cfg      + 800ms slot
#   9. D1(29) slave cfg      + 800ms slot
#   10. D2(29) slave cfg     + 800ms slot
#
# Kolory logu (poziomy ESPHome):
#   - AERO E4(63)        -> ESP_LOGE  (czerwone)
#   - Nano / inne ramki  -> ESP_LOGI  (zielone)
#   - Wlasne TX z ESP    -> ESP_LOGW  (zolte)
################################################################################

uart:
  - id: uart_bus
    rx_pin: GPIO16
    tx_pin: GPIO17
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512

globals:
  # Single-bus parser state (jeden RX, jeden buffer)
  - id: g_buf
    type: uint8_t[32]
  - id: g_pos
    type: uint8_t
    initial_value: "0"
  - id: g_last_byte_ms
    type: uint32_t
    initial_value: "0"     # millis() ostatniego RX bajtu (do timeout resync fragmentu)
  - id: g_master_on
    type: bool
    restore_value: true
    initial_value: "true"    # default ON, sterowane z select.c14_rola
  - id: g_slave_on
    type: bool
    restore_value: true
    initial_value: "false"   # sterowane z select.c14_rola (Rola=Slave aktywuje VS)
  - id: g_config_push_pending
    type: bool
    initial_value: "false"   # flaga: wykryto 80(2A), w nast. cyklu #1 wyslij E4(29) src=0x2A
  - id: g_detected_slave_id
    type: uint8_t
    initial_value: "0"       # id slave (z f[3] w 80(2A), np. 0x2A = id=2)
  - id: g_slave_ack
    type: bool
    initial_value: "false"   # master flag: widzialem slave E4(2x) reactive → ustaw f[26]=0x50 w E5(29)
  # Virtual slaves (2026-04-24): niezalezne switche id=2..5
  # Kazdy wlaczony slucha swojego wake-up (0xA8+id, 0x44, 0x29) i odpowiada E4(0x28+id)
  - id: g_vs_2
    type: bool
    restore_value: true
    initial_value: "false"   # Virtual Slave id=2 aktywny (f[3]=0x2A, wake-up AA,44,08,29)
  - id: g_vs_3
    type: bool
    restore_value: true
    initial_value: "false"   # Virtual Slave id=3 aktywny (f[3]=0x2B, wake-up AB,44,09,29)
  - id: g_vs_4
    type: bool
    restore_value: true
    initial_value: "false"   # Virtual Slave id=4 aktywny (f[3]=0x2C, wake-up AC,44,0A,29)
  - id: g_vs_5
    type: bool
    restore_value: true
    initial_value: "false"   # Virtual Slave id=5 aktywny (f[3]=0x2D, wake-up AD,44,0B,29)
  - id: g_vs_pending_id
    type: uint8_t
    initial_value: "0"       # id virtual slave ktory ma odpowiedziec (0 = brak)
  - id: g_gear_poza
    type: uint8_t
    restore_value: true
    initial_value: "0x01"   # Stop (analogicznie do nastawy strefy Poza w Nano EEPROM)
  - id: g_gear_cmd
    type: uint8_t
    restore_value: true
    initial_value: "0x03"   # Manual B1 (0x01=Stop, 0x03=B1, 0x05=B2, 0x07=B3; +0x08=chlodz overlay dodawany dynamicznie)
  - id: g_bypass_cmd
    type: uint8_t
    restore_value: true
    initial_value: "0x61"   # AUTO (0x60=OFF, 0x61=AUTO, 0x62=ON)
  - id: g_season
    type: uint8_t
    restore_value: true
    initial_value: "0"      # 0=Zima, 1=Lato bez, 2=Chlodzenie
  - id: g_wietrz_on
    type: bool
    restore_value: true
    initial_value: "false"
  - id: g_thermostat
    type: uint8_t
    restore_value: true
    initial_value: "2"      # 0=Harmonogram, 1=Urlop, 2=Manual (z f[27] w E4(29) src=21)
  - id: g_harm_urlop
    type: bool
    restore_value: true
    initial_value: "false"  # Wentylacja=Harm-Urlop: f[28]=bieg bez 0x40 + f[24]=0x32
  - id: g_program
    type: uint8_t
    restore_value: true
    initial_value: "0"      # Programy: 0=Normal, 1=Poza domem (f[5] bit 0x04), 2=Urlop (f[28]=0x40)
  - id: g_rot_e4
    type: uint8_t
    initial_value: "0"      # rotator E4(29) src=21 f[25-26]: 0=00,00 init, 1=01,14, 2=02,01, 3=03,03 (potem 1→2→3→1)
  - id: g_bus_year
    type: uint8_t
    initial_value: "0"      # rok mod 100 z f[26] gdy f[25]=01
  - id: g_bus_month
    type: uint8_t
    initial_value: "0"      # miesiąc z f[26] gdy f[25]=02
  - id: g_bus_day
    type: uint8_t
    initial_value: "0"      # dzień miesiąca z f[26] gdy f[25]=03
  # Cache surowych pól E4(29) src=0x21 mastera (f[3]=0x29) — uzywane przez VS (slave) zeby echo'wac 1:1 z masterem
  # Bez tego rotator daty f[25-26] w VS jest stalym snapshotem ("zaciety slave") — Nano master nie rejestruje takiego slave
  - id: g_m_valid
    type: bool
    initial_value: "false"
  - id: g_m_dow
    type: uint8_t
    initial_value: "0"
  - id: g_m_hh
    type: uint8_t
    initial_value: "0"
  - id: g_m_mm
    type: uint8_t
    initial_value: "0"
  - id: g_m_sp_h
    type: uint8_t
    initial_value: "0x11"
  - id: g_m_sp_l
    type: uint8_t
    initial_value: "0x18"
  - id: g_m_f25
    type: uint8_t
    initial_value: "0"
  - id: g_m_f26
    type: uint8_t
    initial_value: "0"
  - id: g_m_f27
    type: uint8_t
    initial_value: "0"
  - id: g_m_f28
    type: uint8_t
    initial_value: "0"
  - id: g_master_full
    type: bool
    restore_value: true
    initial_value: "false"   # false=Mini (10 ramek), true=Full (27 ramek)
  # Setpointy temperatur (5 trybow, wartosci w stopniach C)
  - id: g_sp_comfort
    type: float
    restore_value: true
    initial_value: "23.0"
  - id: g_sp_eco
    type: float
    restore_value: true
    initial_value: "21.0"
  - id: g_sp_chlodz
    type: float
    restore_value: true
    initial_value: "23.0"
  - id: g_sp_reczna
    type: float
    restore_value: true
    initial_value: "22.0"
  - id: g_sp_poza
    type: float
    restore_value: true
    initial_value: "20.0"
  - id: g_cycle_count
    type: uint32_t
    initial_value: "0"
  - id: g_frame_no
    type: uint8_t
    initial_value: "0"   # numer ramki w cyklu master (1..27 w Master Full); reset na E4(29) src=21 f[3]=29
  - id: g_aero_resp_cycle
    type: uint16_t
    initial_value: "0"
  - id: g_cnt_nano
    type: uint32_t
    initial_value: "0"
  - id: g_last_tx_ms
    type: uint32_t
    initial_value: "0"
  - id: g_last_aero_rx_ms
    type: uint32_t
    initial_value: "0"       # timestamp ostatniej AERO E4(63) - do dynamicznej flagi f[5]=AERO_OK
  - id: g_last_tx_name
    type: std::string
    initial_value: '"none"'
  # Cache temperatur AERO (ostatnie znane, dla broadcastu gdy AERO milczy)
  - id: g_cache_czerp
    type: float
    initial_value: "0.0"
  - id: g_cache_nawiew
    type: float
    initial_value: "0.0"
  - id: g_cache_wyrzut
    type: float
    initial_value: "0.0"
  - id: g_cache_wywiew
    type: float
    initial_value: "0.0"
  - id: g_cache_valid
    type: bool
    initial_value: "false"
  - id: g_cache_age_ms
    type: uint32_t
    initial_value: "0"
  # Setpointy % nawiew/wywiew per bieg (1/2/3/wietrzenie)
  # TODO: wstrzyknac do odpowiednich pol w E4(29)/E5(29) gdy zidentyfikujemy ktore
  # Fabryczne wartosci z E3(29)_44 obserwowane
  - id: g_naw_b1
    type: uint8_t
    restore_value: true
    initial_value: "37"   # 0x25
  - id: g_wyw_b1
    type: uint8_t
    restore_value: true
    initial_value: "32"   # 0x20
  - id: g_naw_b2
    type: uint8_t
    restore_value: true
    initial_value: "45"   # 0x2D
  - id: g_wyw_b2
    type: uint8_t
    restore_value: true
    initial_value: "40"   # 0x28
  - id: g_naw_b3
    type: uint8_t
    restore_value: true
    initial_value: "75"   # 0x4B
  - id: g_wyw_b3
    type: uint8_t
    restore_value: true
    initial_value: "70"   # 0x46
  - id: g_naw_wiet
    type: uint8_t
    restore_value: true
    initial_value: "100"  # 0x64
  - id: g_wyw_wiet
    type: uint8_t
    restore_value: true
    initial_value: "95"   # 0x5F

script:
  # Master TX: nadaje na single-bus (uart_bus). Bus jest fizycznie wspolny dla
  # AERO i Nano, wiec jeden write trafia do obu odbiorcow.
  - id: tx_frame
    mode: single
    parameters:
      name: string
      bytes: std::vector<uint8_t>
    then:
      - lambda: |-
          id(g_last_tx_ms) = millis();
          id(g_last_tx_name) = name;
          id(uart_bus).write_array(bytes.data(), bytes.size());
          {
            char h[120]; int p = 0;
            for (size_t i = 0; i < bytes.size() && p < 110; i++)
              p += snprintf(h+p, 120-p, "%s%02X", i?",":"", bytes[i]);
            ESP_LOGW("c14m", ">>> #%s_%s", name.c_str(), h);
          }

  # Cykl Mini=10 / Full=29 ramek z 800ms slotem po kazdej
  # Petla: ostatnia akcja wywoluje siebie (mode: queued max_runs: 2 => kolejny czeka az obecny skonczy).
  # Eliminuje sztywny interval i timing race (cykl Full > 22.5s, dawniej "mode: single is already running" warning).
  - id: master_cycle
    mode: queued
    max_runs: 2
    then:
      - lambda: |-
          id(g_aero_resp_cycle) = 0;
          // 2026-05-11: g_cycle_count inkrement gdy ESP jest masterem (TX cyklu).
          // Bus reader RX inkrementuje tylko gdy widzi obcego mastera (np. Nano-master);
          // wlasne TX nie wraca przez RS-485, wiec bez tego sensor c14_cycles=0 w trybie Master.
          id(g_cycle_count)++;

      # 1. E4(29) — komenda biegu + sezon + wietrzenie (PIERWSZA jak u Nano)
      # LUB jednorazowo E4(29) src=0x2A config push gdy wykryto 80(2A) od slave (g_config_push_pending)
      - script.execute:
          id: tx_frame
          name: "1"
          bytes: !lambda |-
            // Jesli flaga pending → wyslij config push E4(29) src=0x2A
            if (id(g_config_push_pending)) {
              std::vector<uint8_t> f = {
                0xE4, id(g_detected_slave_id), 0x00, 0x29,
                0x0D,0x01,0x05,0x28,0x1C,0x2A,0x00,0x1E,
                0x01,0x17,0x5F,0x64,0x18,0x14,0x00,0x24,
                0x20,0x28,0x46,0x25,0x2D,0x4B,0x20,0x01,
                0x53,0x23 };
              // f[27]/f[28] dynamiczne z biezacych globals (zamiast hardcoded Zima/B1+stable)
              // żeby slave po config push mial od razu aktualny sezon/bieg/termostat,
              // a nie domyslny snapshot z testow 26.04
              uint8_t v27 = id(g_thermostat) & 0x07;
              if (id(g_season) == 1) v27 |= 0x08;       // Lato bez
              else if (id(g_season) == 2) v27 |= 0x10;  // Chłodzenie
              if (id(g_wietrz_on)) v27 |= 0x20;
              f[27] = v27;
              uint8_t v28 = id(g_gear_cmd);
              if (id(g_thermostat) == 2 && !id(g_harm_urlop)) v28 |= 0x40;
              if (id(g_season) == 2 && !id(g_harm_urlop)) v28 |= 0x08;
              f[28] = v28;
              uint16_t s2 = f[0] + f[1];
              for (int i = 3; i <= 28; i++) s2 += f[i];
              f[2] = (s2 + 0xA3) & 0xFF;
              id(g_config_push_pending) = false;
              ESP_LOGW("c14m", "*** CONFIG PUSH E4(29) src=0x%02X wyslany (f[27]=0x%02X, f[28]=0x%02X) ***",
                       id(g_detected_slave_id), f[27], f[28]);
              return f;
            }
            // Standard E4(29) src=0x21
            std::vector<uint8_t> f = {
              0xE4,0x21,0x00,0x29,0x0A,0x40,0x00,0x02,0x08,0x2E,0x7E,0x00,
              0x11,0x0E,0x11,0x22,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
              0x14,0x64,0x02,0x04,0x00,0x03,0x23 };
            // f[5] = bit 0x40 (AERO_OK heartbeat — Nano trzyma stale SET niezależnie od stanu RX,
            //                  AERO sprawdza ten bit i milczy gdy CLEAR → poprzednia logika "120s window"
            //                  wpadała w spiralę śmierci po pierwszej dłuższej przerwie AERO)
            //        | bit 0x04 (tylko gdy Programy=Poza domem)
            uint8_t f5_prog = (id(g_program) == 1) ? 0x04 : 0x00;  // 1=Poza domem
            f[5] = 0x40 | f5_prog;
            // f[25-26]: 3-fazowa transmisja DATY (rok/miesiąc/dzień) - odkryte 2026-04-26
            // po boot 00,00, potem 01,YY → 02,MM → 03,DD → 01,YY... (cyklicznie)
            auto t = id(ha_time).now();
            uint8_t r = id(g_rot_e4);
            uint8_t year_mod = t.is_valid() ? ((t.year - 2000) % 100) : 0;
            uint8_t month = t.is_valid() ? t.month : 1;
            uint8_t day = t.is_valid() ? t.day_of_month : 1;
            if (r == 0)      { f[25]=0x00; f[26]=0x00;     id(g_rot_e4)=1; }
            else if (r == 1) { f[25]=0x01; f[26]=year_mod; id(g_rot_e4)=2; }
            else if (r == 2) { f[25]=0x02; f[26]=month;    id(g_rot_e4)=3; }
            else             { f[25]=0x03; f[26]=day;      id(g_rot_e4)=1; }
            // f[4] - Nano master ma stałe 0x0A (nie day_of_month!) - zgodne z protokolem
            f[4] = 0x0A;
            // f[7] day_of_week: ESPHome zwraca 1=Nd..7=Sob, Nano oczekuje 0=Pn..6=Nd
            // Konwersja: dow_nano = (dow_esp + 5) % 7
            if (t.is_valid()) {
              f[7] = (t.day_of_week + 5) % 7;
              f[8] = t.hour & 0xFF;
              f[9] = t.minute & 0xFF;
            }
            auto enc = [&f](int idx, float tv) {
              int16_t v = (int16_t)(tv * 10.0f) + 2000;
              if (v < 0) v = 0;
              f[idx] = (v / 128) & 0xFF;
              f[idx+1] = (v % 128) & 0xFF;
            };
            // f[14-15] aktywny setpoint wg cross-table (PROTOCOL §5.6, fix 2026-05-10):
            //   Programy=Poza/Urlop -> g_sp_poza
            //   Term=Manual         -> g_sp_reczna
            //   Term=Harm/Urlop + Zima       -> g_sp_eco
            //   Term=Harm/Urlop + Lato/Chlodz -> g_sp_chlodz
            float active_sp;
            if (id(g_program) == 1 /* Poza domem */ || id(g_program) == 2 /* Urlop */) {
              active_sp = id(g_sp_poza);
            } else if (id(g_thermostat) == 2 /* Manual */) {
              active_sp = id(g_sp_reczna);
            } else if (id(g_season) == 0 /* Zima */) {
              active_sp = id(g_sp_eco);
            } else {
              active_sp = id(g_sp_chlodz);
            }
            enc(14, active_sp);
            // f[12-13] T_pok — realny pomiar z HA sensora (Aqara Zigbee, sensor.0x00158d0007ef8421_temperature)
            // 2026-05-11: bralismy active_sp ale to mylilo AERO (pokoj == SP => brak cooling demand).
            // Fallback 22.0°C gdy HA sensor niedostepny (boot, WiFi down).
            float t_pok = id(ha_t_pok).has_state() ? id(ha_t_pok).state : 22.0f;
            // Sanity: ograniczyc do 5-35°C (zakres realnej pokojowej, zabezpieczenie przed kosmos w razie awarii)
            if (t_pok < 5.0f) t_pok = 5.0f;
            if (t_pok > 35.0f) t_pok = 35.0f;
            enc(12, t_pok);
            uint8_t v27 = id(g_thermostat) & 0x07;  // 0=Harmonogram, 1=Urlop, 2=Manual
            if (id(g_season) == 1) v27 |= 0x08;
            else if (id(g_season) == 2) v27 |= 0x10;
            if (id(g_wietrz_on)) v27 |= 0x20;
            f[27] = v27;
            // f[28]: bieg + flagi (PROTOCOL §3.2, korekta krytyczna 2026-05-11):
            //  Programy=Urlop      → 0x00 (validity=0)
            //  Programy=Poza domem → g_gear_poza + chlodz overlay
            //  Programy=Normal     → bieg z g_gear_cmd + chlodz overlay
            //
            // STABLE BIT 0x40 NIGDY NIE WYSYLANE od ESP-master.
            // Empiria 2026-05-11: AERO milczy gdy ESP wysyla stable+sync w Manual+Zima.
            // Hipoteza: stable bit + f[24]=0x64 wymagaja handshake/sparing fabrycznego
            // (jak Nano-master). ESP-master bez tego sparingu nie ma "uprawnien" do nadawania
            // synced state - AERO go odrzuca. Empirycznie Nano w 12:28-12:36 (Manual+Lato bez)
            // nadawal bez stable+sync i AERO odpowiadal -> ten tryb jest bezpieczny dla ESP.
            uint8_t v28;
            if (id(g_program) == 2 /* Urlop */) {
              v28 = 0x00;
            } else if (id(g_program) == 1 /* Poza domem */) {
              v28 = id(g_gear_poza);
              if (id(g_season) == 2) v28 |= 0x08;
            } else {
              v28 = id(g_gear_cmd);
              if (id(g_season) == 2 && !id(g_harm_urlop)) v28 |= 0x08;
            }
            f[28] = v28;
            // f[24] = 0x32 ZAWSZE (unsynced). 0x64 wymaga handshake AERO ktorego ESP nie ma.
            f[24] = 0x32;
            uint16_t s = f[0] + f[1];
            for (int i = 3; i <= 28; i++) s += f[i];
            f[2] = (s + 0xA3) & 0xFF;
            // Publikuj do sensorów BUS (gdy ESP=master, własne TX nie wraca przez RX, więc tu)
            { uint8_t bieg = f[28] & 0x07;
              // f[28] dolne 3 bity: 0x01=Stop, 0x03=B1, 0x05=B2, 0x07=B3; bit 0=validity
              // Programy=Urlop: f[28]==0x00 (validity=0) → bieg=0 → "Stop"
              const char* bnames[] = {"Stop","Stop","Stop","Bieg 1","Stop","Bieg 2","Stop","Bieg 3"};
              bool is_urlop = (id(g_program) == 2);
              bool is_poza  = ((f[5] & 0x04) != 0);
              if (bieg <= 7) id(ts_bieg).publish_state(bnames[bieg]);
              uint8_t tryb = f[27] & 0x03;
              const char* tnames[] = {"Harmonogram","Urlop","Manual","?"};
              id(s_termostat_bus).publish_state(tnames[tryb]);
              uint8_t sezon_bits = f[27] & 0x18;
              id(s_sezon_bus).publish_state(sezon_bits == 0x00 ? "Zima" : sezon_bits == 0x08 ? "Lato bez" : sezon_bits == 0x10 ? "Chlodzenie" : "?");
              id(s_wietrzenie_bus).publish_state((f[27] & 0x20) != 0);
              float sp = ((f[14] * 128) + (f[15] % 128) - 2000) / 10.0f;
              if (sp > 5 && sp < 35) id(s_sp_active_bus).publish_state(sp);
              // T pokojowa wysylana w f[12-13] (z HA Aqara sensora przez id(ha_t_pok))
              float tpok = ((f[12] * 128) + (f[13] % 128) - 2000) / 10.0f;
              if (tpok > 5 && tpok < 35) id(s_t_pok_bus).publish_state(tpok);
              // Programy: Urlop > Poza domem > Normal
              const char* prog = is_urlop ? "Urlop" : (is_poza ? "Poza domem" : "Normal");
              id(s_program_bus).publish_state(prog);
              // s_wentylacja_bus przeniesione do lambda RX AERO E4(63) f[26] - faktyczny bieg z AERO
              // Zegar + dow z f[7-9]
              char clk[8]; snprintf(clk, sizeof(clk), "%02d:%02d", f[8], f[9]);
              id(s_zegar_bus).publish_state(clk);
              const char* dows[] = {"Pn","Wt","Sr","Cz","Pt","Sob","Nd","?"};
              id(s_dow_bus).publish_state(dows[f[7] & 0x07]);
              // Data z f[25-26] (3 fazy) - aktualizuj globalne i zlóż
              if (f[25] == 0x01) id(g_bus_year) = f[26];
              else if (f[25] == 0x02) id(g_bus_month) = f[26];
              else if (f[25] == 0x03) id(g_bus_day) = f[26];
              if (id(g_bus_year) > 0 && id(g_bus_month) > 0 && id(g_bus_day) > 0) {
                char dt[16]; snprintf(dt, sizeof(dt), "%02d-%02d-20%02d", id(g_bus_day), id(g_bus_month), id(g_bus_year));
                id(s_data_bus).publish_state(dt);
              }
            }
            // Self-update cache dla VS slave: ESP master nie uslyszy wlasnego TX (half-duplex blokuje RX),
            // wiec VS wzialby zaciety cache z czasow gdy mistrzem byl Nano. Tu zapisujemy lokalnie.
            id(g_m_dow)   = f[7];
            id(g_m_hh)    = f[8];
            id(g_m_mm)    = f[9];
            id(g_m_sp_h)  = f[14];
            id(g_m_sp_l)  = f[15];
            id(g_m_f25)   = f[25];
            id(g_m_f26)   = f[26];
            id(g_m_f27)   = f[27];
            id(g_m_f28)   = f[28];
            id(g_m_valid) = true;
            return f;
      - delay: 800ms

      # 2. E3(29) src=44 — QUERY (trigger AERO) + nastawy % per bieg + znacznik biegu f[28]
      # f[14-15]=Wiet wyw/naw, f[20-22]=B1/B2/B3 wyw, f[23-25]=B1/B2/B3 naw
      # f[28] znacznik biegu: wzor f[28] = bieg + 0x10
      - script.execute:
          id: tx_frame
          name: "2"
          bytes: !lambda |-
            std::vector<uint8_t> f = {
              0xE3,0x44,0x00,0x29,0x32,0x00,0x05,0x0A,0x28,0x1C,0x2A,0x1E,
              0x01,0x17,0x5F,0x64,0x18,0x14,0x00,0x24,0x20,0x28,0x46,0x25,
              0x2D,0x4B,0x20,0x01,0x13,0x23 };
            f[14] = id(g_wyw_wiet);
            f[15] = id(g_naw_wiet);
            f[20] = id(g_wyw_b1);
            f[21] = id(g_wyw_b2);
            f[22] = id(g_wyw_b3);
            f[23] = id(g_naw_b1);
            f[24] = id(g_naw_b2);
            f[25] = id(g_naw_b3);
            // bieg per Programy + chlodz overlay (synchronizacja z E4):
            //   Urlop      → 0 (validity=0)
            //   Poza domem → g_gear_poza
            //   Normal     → g_gear_cmd
            // f[28] = bieg | 0x10 marker (BEZ stable bit 0x40 - patrz E4 lambda komentarz)
            uint8_t v28;
            if (id(g_program) == 2) v28 = 0x00;
            else if (id(g_program) == 1) v28 = id(g_gear_poza);
            else v28 = id(g_gear_cmd);
            if (id(g_season) == 2 && !id(g_harm_urlop) && id(g_program) != 2) v28 |= 0x08;
            f[28] = v28 | 0x10;
            // f[27] = sezon | bypass_cmd | wietrz (PROTOCOL §3.3, korekta 2026-05-10):
            //   sezon szyld:  Zima=0x00, Lato bez=0x08, Chłodz=0x10
            //   bypass cmd:   OFF=0x00, AUTO=0x01, ON=0x02 (z g_bypass_cmd 0x60/0x61/0x62)
            //   wietrz overlay: +0x20 gdy ON
            uint8_t v27 = 0x00;
            if (id(g_season) == 1) v27 |= 0x08;
            else if (id(g_season) == 2) v27 |= 0x10;
            v27 |= (id(g_bypass_cmd) - 0x60) & 0x03;   // 0x60→0, 0x61→1, 0x62→2
            if (id(g_wietrz_on)) v27 |= 0x20;
            f[27] = v27;
            uint16_t s = f[0] + f[1];
            for (int i = 3; i <= 28; i++) s += f[i];
            f[2] = (s + 0xA3) & 0xFF;
            // Publikuj do sensorów BUS (% nastawy)
            id(s_wyw_wiet_bus).publish_state(f[14]);
            id(s_naw_wiet_bus).publish_state(f[15]);
            id(s_wyw_b1_bus).publish_state(f[20]);
            id(s_wyw_b2_bus).publish_state(f[21]);
            id(s_wyw_b3_bus).publish_state(f[22]);
            id(s_naw_b1_bus).publish_state(f[23]);
            id(s_naw_b2_bus).publish_state(f[24]);
            id(s_naw_b3_bus).publish_state(f[25]);
            return f;
      - delay: 800ms

