################################################################################
# C14 — user-level template (Piotr / esp02)
#
# Tutaj siedzi tylko to, co specyficzne dla TWOJEGO sprzetu/sieci:
#   - device_name / friendly_name (substitutions)
#   - esphome:/esp32: (board, framework)
#   - api:/ota: (klucze)
#   - uart: (piny + id: uart_bus)
#   - wifi:/bluetooth: opcjonalnie
#
# Caly silnik C14 (protokol AERO/Nano, ramki 30B, cykl Master, parser, encje
# HA) siedzi w packages/c14_core.yaml — wczytywany ponizej w `packages:`.
#
# Topologia bus (RS-485 9600 8N1): jeden modul HW-0519 wpiety rownolegle do
# A1/B1 magistrali Nano <-> AERO. ESP widzi caly ruch + moze nadawac wlasne
# ramki (master/VS).
################################################################################

substitutions:
  device_name: esp02
  friendly_name: "C14 Master"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

api:
  encryption:
    key: !secret esp02_api

ota:
  - platform: esphome
    password: !secret ota_password

packages:
  c14_core: !include packages/c14_core.yaml
  wifi: !include packages/wifi_Pioszym_IoT.yaml
  device_base: !include packages/device_base.yaml

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Warsaw

# Opcjonalnie — bluetooth proxy do HA (mozna usunac jesli nie potrzebne)
esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

# KONTRAKT z c14_core: uart MUSI miec `id: uart_bus`, 9600 8N1, rx_buffer >=512.
# Piny dowolne — tu GPIO16/17, ale dla innego boarda zmienisz.
uart:
  - id: uart_bus
    rx_pin: GPIO16
    tx_pin: GPIO17
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512
