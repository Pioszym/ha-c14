  # Virtual slave response (2026-04-24): uniwersalny dla id=2..5, czyta g_vs_pending_id
  # 2026-04-26: full echo z mastera (cache g_m_*) + wymuszamy stan SYNCED (f[24]=0x64, f[28] |= 0x40)
  # Hipoteza: Nano master rejestruje tylko slave ktory echo'wuje rotator daty f[25-26] (3-fazowy);
  # statyczne f[25-26] u VS sprawialy ze master widzial "zaciety slave" i nie wysylal config push do id>=3.
  - id: vs_respond
    mode: single
    then:
      - delay: 280ms   # typowy delay Nano slave po wake-up (280-300ms zmierzono empirycznie)
      - lambda: |-
          uint8_t vs_id = id(g_vs_pending_id);
          if (vs_id < 2 || vs_id > 5) return;
          // Szablon SYNCED: f[7]=0x02 (ale nadpisany dow z mastera), f[24]=0x64, f[28]=0x43 (B1+sync, nadpisany)
          std::vector<uint8_t> f = {
            0xE4,0x21,0x00,0x2A,0x0A,0x40,0x00,0x02,0x00,0x00,0x7E,0x00,
            0x11,0x23,0x11,0x18,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
            0x14,0x64,0x00,0x00,0x00,0x43,0x23 };
          f[3] = 0x28 + vs_id;  // id=2->0x2A, id=5->0x2D
          // Echo z ostatniego E4(29) src=0x21 mastera (f[3]=0x29) - jak prawdziwy Nano slave
          if (id(g_m_valid)) {
            f[7]  = id(g_m_dow);                       // dow z mastera
            f[8]  = id(g_m_hh);                        // godz z mastera
            f[9]  = id(g_m_mm);                        // min z mastera
            f[14] = id(g_m_sp_h);                      // setpoint H z mastera
            f[15] = id(g_m_sp_l);                      // setpoint L z mastera
            f[25] = id(g_m_f25);                       // rotator faza (0x01/02/03) - KLUCZOWE
            f[26] = id(g_m_f26);                       // rotator wartosc (rok/mies/dzien)
            f[27] = id(g_m_f27);                       // tryb termostatu + sezon + wietrzenie
            f[28] = (id(g_m_f28) & 0x07) | 0x40;       // bieg z mastera + sync flag (synced state)
          } else {
            // Fallback przed pierwszym widzianym E4 mastera - zegar z HA
            auto t = id(ha_time).now();
            if (t.is_valid()) {
              f[8] = t.hour & 0xFF;
              f[9] = t.minute & 0xFF;
            }
          }
          // Checksum K=0xA3 (jak E4 od slave)
          uint16_t s = f[0] + f[1];
          for (int i = 3; i <= 28; i++) s += f[i];
          f[2] = (s + 0xA3) & 0xFF;
          // ESP TX na single-bus
          id(uart_bus).write_array(f.data(), f.size());
          {
            char h[120]; int p = 0;
            for (size_t i = 0; i < f.size() && p < 110; i++)
              p += snprintf(h+p, 120-p, "%s%02X", i?",":"", f[i]);
            ESP_LOGW("c14m", ">>> SLAVE E4(%02X) id=%d [%s]", f[3], vs_id, h);
          }

  # Virtual slave 80 boot — wysyla jednorazowo po wlaczeniu switcha
  - id: vs_boot_80
    mode: queued   # mozna odpalac rownolegle dla roznych id
    parameters:
      vs_id: int
    then:
      - lambda: |-
          if (vs_id < 2 || vs_id > 20) return;
          // Zabezpieczenie: 80 boot leci na bus tylko w Rola=Slave (zeby nie wprowadzac mastera w blad)
          if (!id(g_slave_on)) {
            ESP_LOGW("c14m", "[SLAVE] 80 boot id=%d skipped (Rola != Slave)", vs_id);
            return;
          }
          std::vector<uint8_t> f = {
            0x80,0x44,0x5F,0x2A,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
            0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,0x7E,
            0x7E,0x7E,0x7E,0x7E,0x7E,0x23 };
          f[3] = 0x28 + vs_id;
          f[2] = (0x5F + vs_id - 2) & 0xFF;  // delta CRC liniowa
          // ESP TX na single-bus
          id(uart_bus).write_array(f.data(), f.size());
          char h[120]; int p = 0;
          for (size_t i = 0; i < f.size() && p < 110; i++)
            p += snprintf(h+p, 120-p, "%s%02X", i?",":"", f[i]);
          ESP_LOGW("c14m", ">>> SLAVE 80(%02X) id=%d [%s]", f[3], vs_id, h);

interval:
  # Single-bus RX parser — czyta z uart_bus, dispatchuje per zrodlo ramki:
  #   - AERO E4(63)  -> publikacja sensorow temperatur + ESP_LOGE (czerwone)
  #   - reszta       -> bus sensors / VS / master detekcja + ESP_LOGI (zielone)
  - interval: 100ms
    then:
      - lambda: |-
          uint8_t b;
          int reads = 0;
          while (id(uart_bus).available() && reads++ < 256) {
            if (!id(uart_bus).read_byte(&b)) break;
            if (id(g_pos) < 32) {
              id(g_buf)[id(g_pos)] = b;
              id(g_pos)++;
            }
            if (b == 0x23 && id(g_pos) >= 30) {
              uint8_t len = id(g_pos);
              uint8_t *f = id(g_buf);
              uint32_t dt = millis() - id(g_last_tx_ms);

              auto T = [](uint8_t h, uint8_t l) -> float {
                return ((h * 128) + (l % 128) - 2000) / 10.0f;
              };

              bool is_aero = (f[0] == 0xE4 && f[3] == 0x63);

              if (is_aero) {
                float cz = T(f[10], f[11]);
                float nw = T(f[14], f[15]);
                float wt = T(f[16], f[17]);
                float wy = T(f[18], f[19]);
                uint8_t naw_pct = f[24];
                uint8_t wyw_pct = f[25];
                uint8_t bieg = f[26];
                bool bypass = (f[28] & 0x20) != 0;
                // Cache do globals
                id(g_cache_czerp) = cz;
                id(g_cache_nawiew) = nw;
                id(g_cache_wyrzut) = wt;
                id(g_cache_wywiew) = wy;
                id(g_cache_valid) = true;
                id(g_cache_age_ms) = millis();
                // Publikuj sensory
                id(s_czerp).publish_state(cz);
                id(s_nawiew).publish_state(nw);
                id(s_wyrzut).publish_state(wt);
                id(s_wywiew).publish_state(wy);
                id(s_naw_pct).publish_state(naw_pct);
                id(s_wyw_pct).publish_state(wyw_pct);
                id(ts_bypass).publish_state(bypass ? "Otwarty" : "Zamkniety");
                // f[27] flaga "AERO pracuje" (PROTOCOL §3.4): 0x00=Stop, 0x02=B1/B2/B3, 0x0A=Wietrzenie aktywne (0x08|0x02)
                id(bs_fan).publish_state((f[27] & 0x02) != 0);
                // Aero: Bieg (s_wentylacja_bus) - faktyczny stan AERO z f[26]
                const char* wn[] = {"Stop","Bieg 1","Bieg 2","Bieg 3","Wietrzenie"};
                if (bieg <= 4) id(s_wentylacja_bus).publish_state(wn[bieg]);
                id(g_aero_resp_cycle)++;
                id(g_last_aero_rx_ms) = millis();  // dla dynamicznej flagi f[5]=AERO_OK w E4(29)
                {
                  char h[120]; int p = 0;
                  for (int i = 0; i < 30 && p < 110; i++)
                    p += snprintf(h+p, 120-p, "%s%02X", i?",":"", f[i]);
                  ESP_LOGE("c14m", "<<< AERO  %02X(%02X) [%s]", f[0], f[3], h);
                }
              } else {
                // PROTOCOL §3.1: f[1] to marker typu, NIE adres zrodlowy.
                // Zrodlo rozpoznaj po f[3]: 0x29 = master id=1; 0x2A..0x3C = slave (subtyp = 0x28+id)
                bool from_slave = (f[3] >= 0x2A && f[3] <= 0x3C);
                // Numer ramki TYLKO dla mastera (f[3]=0x29) - jak w PROTOCOL §2 Master Mini/Full.
                // Reset na E4(29) src=21 f[3]=29 (start cyklu); slave i AERO bez numeru.
                if (!from_slave) {
                  if (f[0] == 0xE4 && f[1] == 0x21 && f[3] == 0x29) {
                    id(g_frame_no) = 1;
                  } else {
                    if (id(g_frame_no) < 99) id(g_frame_no)++;
                  }
                }
                {
                  char h[120]; int p = 0;
                  for (int i = 0; i < len && p < 110; i++)
                    p += snprintf(h+p, 120-p, "%s%02X", i?",":"", f[i]);
                  if (from_slave) {
                    ESP_LOGI("c14m", "<<< SLAVE  %02X(%02X) [%s]", f[0], f[3], h);
                  } else {
                    ESP_LOGI("c14m", "#%02d MASTER %02X(%02X) [%s]", id(g_frame_no), f[0], f[3], h);
                  }
                }
                // Virtual slaves: per-id wake-up detection (0xA8+id, 0x44, 0x29) - gate per switch g_vs_N
                if (f[1] == 0x44 && f[3] == 0x29 && f[0] >= 0xAA && f[0] <= 0xAD) {
                  uint8_t vs_id = f[0] - 0xA8;  // AA->2, AB->3, AC->4, AD->5
                  bool enabled = (vs_id == 2 && id(g_vs_2)) ||
                                 (vs_id == 3 && id(g_vs_3)) ||
                                 (vs_id == 4 && id(g_vs_4)) ||
                                 (vs_id == 5 && id(g_vs_5));
                  if (enabled) {
                    id(g_vs_pending_id) = vs_id;
                    id(vs_respond).execute();
                  }
                }
                // Bus reader: E4(29) src=0x21 broadcast → publikuj do sensorów BUS (read-only, niezależnie od roli ESP)
                if (f[0] == 0xE4 && f[1] == 0x21 && f[3] == 0x29) {
                  // E4(29) src=0x21 to PIERWSZA ramka cyklu (master broadcast) - znacznik cykl start
                  id(g_cycle_count)++;
                  // Cache surowych pol mastera dla VS slave echo (rotator daty, dow, zegar, setpoint, tryb, bieg)
                  id(g_m_dow)  = f[7];
                  id(g_m_hh)   = f[8];
                  id(g_m_mm)   = f[9];
                  id(g_m_sp_h) = f[14];
                  id(g_m_sp_l) = f[15];
                  id(g_m_f25)  = f[25];
                  id(g_m_f26)  = f[26];
                  id(g_m_f27)  = f[27];
                  id(g_m_f28)  = f[28];
                  id(g_m_valid) = true;
                  uint8_t bieg = f[28] & 0x07;
                  const char* bnames[] = {"Stop","Stop","Stop","Bieg 1","Stop","Bieg 2","Stop","Bieg 3"};
                  if (bieg <= 7) id(ts_bieg).publish_state(bnames[bieg]);
                  uint8_t tryb = f[27] & 0x03;  // bity 0-1: tryb termostatu
                  const char* tnames[] = {"Harmonogram","Urlop","Manual","?"};
                  id(s_termostat_bus).publish_state(tnames[tryb]);
                  uint8_t sezon_bits = f[27] & 0x18;  // bity 3-4: sezon
                  id(s_sezon_bus).publish_state(sezon_bits == 0x00 ? "Zima" : sezon_bits == 0x08 ? "Lato bez" : sezon_bits == 0x10 ? "Chlodzenie" : "?");
                  bool wiet = (f[27] & 0x20) != 0;
                  id(s_wietrzenie_bus).publish_state(wiet);
                  // Aktywny setpoint
                  float sp = ((f[14] * 128) + (f[15] % 128) - 2000) / 10.0f;
                  if (sp > 5 && sp < 35) id(s_sp_active_bus).publish_state(sp);
                  // Program (z f[5] bit 0x04 + f[28]=0x02)
                  bool harm_active = (f[5] & 0x04) != 0;
                  // Programy: Urlop > Poza domem > Normal
                  const char* prog = (f[28] == 0x40) ? "Urlop" : (harm_active ? "Poza domem" : "Normal");
                  id(s_program_bus).publish_state(prog);
                  // s_wentylacja_bus przeniesione do lambda RX AERO E4(63) - faktyczny bieg z AERO
                  // Zegar + dow z f[7-9]
                  char clk[8]; snprintf(clk, sizeof(clk), "%02d:%02d", f[8], f[9]);
                  id(s_zegar_bus).publish_state(clk);
                  const char* dows[] = {"Pn","Wt","Sr","Cz","Pt","Sob","Nd","?"};
                  id(s_dow_bus).publish_state(dows[f[7] & 0x07]);
                  // Data z f[25-26] (3 fazy)
                  if (f[25] == 0x01) id(g_bus_year) = f[26];
                  else if (f[25] == 0x02) id(g_bus_month) = f[26];
                  else if (f[25] == 0x03) id(g_bus_day) = f[26];
                  if (id(g_bus_year) > 0 && id(g_bus_month) > 0 && id(g_bus_day) > 0) {
                    char dts[16]; snprintf(dts, sizeof(dts), "%02d-%02d-20%02d", id(g_bus_day), id(g_bus_month), id(g_bus_year));
                    id(s_data_bus).publish_state(dts);
                  }
                }
                // Bus reader: E3(29) src=0x44 → nastawy % per bieg (do sensorów BUS)
                if (f[0] == 0xE3 && f[1] == 0x44 && f[3] == 0x29) {
                  if (f[14] <= 100) id(s_wyw_wiet_bus).publish_state(f[14]);
                  if (f[15] <= 100) id(s_naw_wiet_bus).publish_state(f[15]);
                  if (f[20] <= 100) id(s_wyw_b1_bus).publish_state(f[20]);
                  if (f[21] <= 100) id(s_wyw_b2_bus).publish_state(f[21]);
                  if (f[22] <= 100) id(s_wyw_b3_bus).publish_state(f[22]);
                  if (f[23] <= 100) id(s_naw_b1_bus).publish_state(f[23]);
                  if (f[24] <= 100) id(s_naw_b2_bus).publish_state(f[24]);
                  if (f[25] <= 100) id(s_naw_b3_bus).publish_state(f[25]);
                }
                // Bus reader: E5(29) src=0x21 → setpointy temp + bypass cmd (do sensorów BUS)
                if (f[0] == 0xE5 && f[1] == 0x21 && f[3] == 0x29) {
                  float comf = T(f[8], f[9]);
                  float eco = T(f[10], f[11]);
                  float chl = T(f[12], f[13]);
                  float rec = T(f[14], f[15]);
                  float poz = T(f[16], f[17]);
                  if (comf > 5 && comf < 35) id(s_sp_comfort_bus).publish_state(comf);
                  if (eco > 5 && eco < 35) id(s_sp_eco_bus).publish_state(eco);
                  if (chl > 5 && chl < 35) id(s_sp_chlodz_bus).publish_state(chl);
                  if (rec > 5 && rec < 35) id(s_sp_reczna_bus).publish_state(rec);
                  if (poz > 5 && poz < 35) id(s_sp_poza_bus).publish_state(poz);
                  // Bypass tryb (f[25]): 0x60=OFF, 0x61=AUTO, 0x62=ON
                  const char* bp = (f[25] == 0x60) ? "OFF" : (f[25] == 0x61) ? "AUTO" : (f[25] == 0x62) ? "ON" : "?";
                  id(s_bypass_cmd_bus).publish_state(bp);
                }
                // Master reactive: 80(29) src=0x44 f[3]=0x2X (slave boot announcement) → zaplanuj config push E4(29) src=0x2X na nast. pozycji #1
                if (f[0] == 0x80 && f[1] == 0x44 && id(g_master_on)) {
                  id(g_config_push_pending) = true;
                  id(g_detected_slave_id) = f[3];  // np. 0x2A dla id=2
                  ESP_LOGW("c14m", "*** Slave boot detected (f[3]=0x%02X) → config push zaplanowany na nast. cykl #1", f[3]);
                }
                // Master detekcja: slave reactive E4(29) src=0x21 f[3]=0x2X → ustaw g_slave_ack (→ f[26]=0x50 w E5(29))
                if (f[0] == 0xE4 && f[1] == 0x21 && f[3] >= 0x2A && f[3] <= 0x3C && id(g_master_on)) {
                  if (!id(g_slave_ack)) {
                    id(g_slave_ack) = true;
                    ESP_LOGW("c14m", "*** Slave reactive detected (f[3]=0x%02X) → f[26]=0x50 w E5 od teraz", f[3]);
                  }
                }
                id(g_cnt_nano)++;
              }
              id(g_pos) = 0;
            }
            if (id(g_pos) >= 32) id(g_pos) = 0;
            id(g_last_byte_ms) = millis();
          }
          // Timeout resync: fragment + 100ms cisza = stracilismy pozostale bajty, reset
          // Zwiekszone z 50ms na 100ms zeby zlapac ramki z dluzszymi pauzami miedzy bajtami (HW-0519 enable/disable)
          // Hex dump bufora dla diagnostyki - mozna zobaczyc CO AERO nadaje (jesli nadaje skrocone ramki)
          if (id(g_pos) > 0 && id(g_pos) < 30 && (millis() - id(g_last_byte_ms)) > 100) {
            char h[120]; int p = 0;
            for (uint8_t i = 0; i < id(g_pos) && p < 110; i++)
              p += snprintf(h+p, 120-p, "%s%02X", i?",":"", id(g_buf)[i]);
            ESP_LOGW("c14m", "[BUS] FRAGMENT pos=%u quiet=%lums drop [%s]",
                     id(g_pos), (unsigned long)(millis() - id(g_last_byte_ms)), h);
            id(g_pos) = 0;
          }

