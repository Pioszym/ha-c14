      # 5. E5(29) — setpointy + bypass + sezon
      # f[6-7]=T.Czerpnia (z cache AERO), f[8-9]=Comfort, f[10-11]=Eco, f[12-13]=Chlodzenie,
      # f[14-15]=Zadana reczna, f[16-17]=Poza domem, f[25]=bypass, f[27]=sezon (0/0x0A/0x14),
      # f[28]=kod biegu dla UI (0=Stop, 1=B1, 2=B2, 3=B3)
      - script.execute:
          id: tx_frame
          name: "5"
          bytes: !lambda |-
            std::vector<uint8_t> f = {
              0xE5,0x21,0x00,0x29,0x00,0x00,0x10,0x4D,0x11,0x36,0x11,0x22,
              0x11,0x36,0x11,0x2C,0x11,0x18,0x00,0x30,0x7E,0x00,0x7E,0x00,
              0x00,0x61,0x00,0x00,0x00,0x23 };
            // Kodowanie temperatury: val = temp*10 + 2000 -> H=val/128, L=val%128
            auto enc = [&f](int idx, float t) {
              int16_t v = (int16_t)(t * 10.0f) + 2000;
              if (v < 0) v = 0;
              f[idx] = (v / 128) & 0xFF;
              f[idx+1] = (v % 128) & 0xFF;
            };
            if (id(g_cache_valid)) enc(6, id(g_cache_czerp));
            enc(8, id(g_sp_comfort));
            enc(10, id(g_sp_eco));
            enc(12, id(g_sp_chlodz));
            enc(14, id(g_sp_reczna));
            enc(16, id(g_sp_poza));
            f[25] = id(g_bypass_cmd);
            // f[26] slave ACK flag: 0x50 gdy widzielismy slave reactive, 0x00 gdy nie ma slave
            f[26] = id(g_slave_ack) ? 0x50 : 0x00;
            // f[27] sezon: 0=Zima -> 0x00, 1=Lato bez -> 0x0A, 2=Chlodzenie -> 0x14
            uint8_t s27 = 0x00;
            if (id(g_season) == 1) s27 = 0x0A;
            else if (id(g_season) == 2) s27 = 0x14;
            f[27] = s27;
            // f[28] kod biegu w E5: 0/1/2/3 sekwencyjnie (bez bitu validity)
            uint8_t g = id(g_gear_cmd) & 0x07;
            f[28] = (g == 0x01) ? 0x00 : (g == 0x03) ? 0x01 : (g == 0x05) ? 0x02 : (g == 0x07) ? 0x03 : 0x00;
            uint16_t s = f[0] + f[1];
            for (int i = 3; i <= 28; i++) s += f[i];
            f[2] = (s + 0xA3) & 0xFF;
            // Publikuj setpointy do sensorów BUS (z E5)
            { auto T = [](uint8_t h, uint8_t l) -> float { return ((h * 128) + (l % 128) - 2000) / 10.0f; };
              float comf = T(f[8], f[9]); if (comf > 5 && comf < 35) id(s_sp_comfort_bus).publish_state(comf);
              float eco = T(f[10], f[11]); if (eco > 5 && eco < 35) id(s_sp_eco_bus).publish_state(eco);
              float chl = T(f[12], f[13]); if (chl > 5 && chl < 35) id(s_sp_chlodz_bus).publish_state(chl);
              float rec = T(f[14], f[15]); if (rec > 5 && rec < 35) id(s_sp_reczna_bus).publish_state(rec);
              float poz = T(f[16], f[17]); if (poz > 5 && poz < 35) id(s_sp_poza_bus).publish_state(poz);
              // Bypass tryb (f[25]): 0x60=OFF, 0x61=AUTO, 0x62=ON
              const char* bp = (f[25] == 0x60) ? "OFF" : (f[25] == 0x61) ? "AUTO" : (f[25] == 0x62) ? "ON" : "?";
              id(s_bypass_cmd_bus).publish_state(bp); }
            return f;
      - delay: 800ms

